[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowhero"
version = "0.10.2"
description = "Desktop flow cytometry analysis on FlowKit: gating, compensation and full-event statistics"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Jonathan Held"}, {name = "Codex (OpenAI)"}, {name = "Claude (Anthropic)"}]
keywords = ["flow cytometry", "FCS", "gating", "FlowKit", "Gating-ML"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10,<3.13"
dependencies = ["flowkit==1.2.3", "PySide6==6.10.0", "pyqtgraph==0.13.7"]

[project.scripts]
flowhero = "flowhero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
